<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>战斗机图片 — Fighter Jet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1020;
      color: #cce0ff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f5c842, #e0f4ff, #f5c842);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #7aabce;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }
    .image-frame {
      border: 2px solid #2a4a6a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 60px 8px rgba(80,160,240,0.18), 0 0 0 1px #1a3050;
      max-width: 1100px;
      width: 100%;
    }
    .image-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    .info {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #5080a0;
    }
    a {
      color: #5ab0e8;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>⚡ 现代隐形战斗机</h1>
  <p class="subtitle">写实电影风格 · 银灰色战斗机穿越云层 · 金色阳光</p>
  <div class="image-frame">
    <img src="fighter-jet.svg" alt="现代隐形战斗机穿越云层，写实电影风格，金色阳光" width="1600" height="900"/>
  </div>
  <p class="info">
    文件：<a href="fighter-jet.svg">fighter-jet.svg</a> &nbsp;·&nbsp;
    格式：SVG（可缩放矢量图形）&nbsp;·&nbsp;
    尺寸：1600 × 900 px
  </p>
</body>
</html>
