<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 900" width="1600" height="900">
  <title>Modern Stealth Fighter Jet — Cinematic Style</title>
  <desc>A silver-grey modern stealth fighter jet piercing through clouds at high speed, with golden sunlight rays and cinematic depth.</desc>

  <defs>
    <!-- Sky gradient: deep blue at top, lighter towards horizon -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="40%"  stop-color="#1a3a6e"/>
      <stop offset="75%"  stop-color="#3a6fa8"/>
      <stop offset="100%" stop-color="#7fb3d3"/>
    </linearGradient>

    <!-- Golden sunlight burst -->
    <radialGradient id="sunGrad" cx="78%" cy="18%" r="45%">
      <stop offset="0%"   stop-color="#fff8c0" stop-opacity="0.9"/>
      <stop offset="30%"  stop-color="#f5c842" stop-opacity="0.5"/>
      <stop offset="70%"  stop-color="#e07c00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1628"  stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud texture gradient -->
    <linearGradient id="cloudGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8dff0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e8f4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a0c8e8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cloudGrad3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d0e8f8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Jet body gradient: metallic silver-grey -->
    <linearGradient id="fuselageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d8dfe8"/>
      <stop offset="30%"  stop-color="#a8b4c0"/>
      <stop offset="60%"  stop-color="#78899a"/>
      <stop offset="100%" stop-color="#3a4a58"/>
    </linearGradient>

    <!-- Wing top gradient -->
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c0ccd8"/>
      <stop offset="50%"  stop-color="#8090a0"/>
      <stop offset="100%" stop-color="#40505e"/>
    </linearGradient>

    <!-- Engine glow -->
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff8c30" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#ff5010" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#cc2000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>

    <!-- Afterburner flame gradient -->
    <linearGradient id="flameGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffa0" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ffcc00" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#ff6600" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#cc2200" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Speed lines blur filter -->
    <filter id="motionBlur" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6 1"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunRayBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>

    <!-- Clip path for scene -->
    <clipPath id="sceneClip">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sceneClip)">

    <!-- ═══ BACKGROUND SKY ═══ -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>

    <!-- ═══ SUN GLOW ═══ -->
    <rect width="1600" height="900" fill="url(#sunGrad)"/>

    <!-- ═══ SUN RAYS ═══ -->
    <g filter="url(#sunRayBlur)" opacity="0.35">
      <line x1="1248" y1="162" x2="0"    y2="900" stroke="#f5c842" stroke-width="80" stroke-opacity="0.25"/>
      <line x1="1248" y1="162" x2="200"  y2="900" stroke="#f5c842" stroke-width="60" stroke-opacity="0.25"/>
      <line x1="1248" y1="162" x2="500"  y2="900" stroke="#f5c842" stroke-width="45" stroke-opacity="0.2"/>
      <line x1="1248" y1="162" x2="800"  y2="900" stroke="#f5c842" stroke-width="35" stroke-opacity="0.2"/>
      <line x1="1248" y1="162" x2="1100" y2="900" stroke="#f5c842" stroke-width="30" stroke-opacity="0.18"/>
      <line x1="1248" y1="162" x2="1400" y2="900" stroke="#f5c842" stroke-width="25" stroke-opacity="0.15"/>
      <line x1="1248" y1="162" x2="1600" y2="600" stroke="#f5c842" stroke-width="20" stroke-opacity="0.12"/>
      <line x1="1248" y1="162" x2="1600" y2="300" stroke="#f5c842" stroke-width="18" stroke-opacity="0.10"/>
    </g>

    <!-- ═══ DISTANT CLOUDS (background) ═══ -->
    <!-- Far back clouds - small, hazy -->
    <g opacity="0.45" filter="url(#softBlur)">
      <ellipse cx="100"  cy="340" rx="180" ry="45"  fill="#c8dff5"/>
      <ellipse cx="50"   cy="325" rx="110" ry="35"  fill="#d8ecff"/>
      <ellipse cx="200"  cy="350" rx="140" ry="38"  fill="#c0d8f0"/>
      <ellipse cx="1450" cy="300" rx="200" ry="50"  fill="#c8dff5"/>
      <ellipse cx="1380" cy="285" rx="130" ry="38"  fill="#d8ecff"/>
      <ellipse cx="1520" cy="310" rx="120" ry="35"  fill="#c0d8f0"/>
      <ellipse cx="750"  cy="260" rx="160" ry="40"  fill="#cce0f5"/>
      <ellipse cx="680"  cy="248" rx="100" ry="30"  fill="#d8ecff"/>
      <ellipse cx="830"  cy="270" rx="130" ry="35"  fill="#c5dcf3"/>
    </g>

    <!-- Mid clouds -->
    <g opacity="0.7">
      <!-- Cloud cluster left -->
      <ellipse cx="80"  cy="580" rx="240" ry="70"  fill="url(#cloudGrad2)"/>
      <ellipse cx="0"   cy="560" rx="160" ry="55"  fill="url(#cloudGrad1)"/>
      <ellipse cx="200" cy="595" rx="180" ry="60"  fill="url(#cloudGrad2)"/>
      <ellipse cx="130" cy="555" rx="200" ry="65"  fill="url(#cloudGrad1)"/>
      <!-- Cloud cluster right -->
      <ellipse cx="1520" cy="520" rx="200" ry="65"  fill="url(#cloudGrad2)"/>
      <ellipse cx="1600" cy="500" rx="150" ry="55"  fill="url(#cloudGrad1)"/>
      <ellipse cx="1420" cy="535" rx="170" ry="58"  fill="url(#cloudGrad2)"/>
      <ellipse cx="1480" cy="505" rx="190" ry="62"  fill="url(#cloudGrad1)"/>
    </g>

    <!-- ═══ FOREGROUND CLOUDS (the jet pierces through) ═══ -->
    <!-- Bottom cloud bank -->
    <g opacity="0.88">
      <ellipse cx="300"  cy="820" rx="350" ry="120" fill="url(#cloudGrad1)"/>
      <ellipse cx="100"  cy="840" rx="250" ry="100" fill="url(#cloudGrad3)"/>
      <ellipse cx="500"  cy="830" rx="300" ry="110" fill="url(#cloudGrad1)"/>
      <ellipse cx="700"  cy="845" rx="280" ry="105" fill="url(#cloudGrad2)"/>
      <ellipse cx="900"  cy="820" rx="320" ry="115" fill="url(#cloudGrad1)"/>
      <ellipse cx="1100" cy="840" rx="300" ry="108" fill="url(#cloudGrad3)"/>
      <ellipse cx="1300" cy="825" rx="340" ry="120" fill="url(#cloudGrad1)"/>
      <ellipse cx="1500" cy="850" rx="260" ry="100" fill="url(#cloudGrad2)"/>
      <ellipse cx="1600" cy="835" rx="200" ry="95"  fill="url(#cloudGrad1)"/>
    </g>

    <!-- ═══ SPEED LINES (motion blur streaks) ═══ -->
    <g filter="url(#motionBlur)" opacity="0.18">
      <line x1="0"   y1="380" x2="600" y2="420" stroke="#ffffff" stroke-width="2"/>
      <line x1="0"   y1="395" x2="550" y2="430" stroke="#e0eeff" stroke-width="1.5"/>
      <line x1="0"   y1="410" x2="580" y2="445" stroke="#ffffff" stroke-width="1"/>
      <line x1="0"   y1="430" x2="500" y2="460" stroke="#c8d8ff" stroke-width="1"/>
      <line x1="50"  y1="360" x2="620" y2="400" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="0"   y1="450" x2="480" y2="478" stroke="#e0eeff" stroke-width="1"/>
      <line x1="0"   y1="480" x2="460" y2="505" stroke="#ffffff" stroke-width="0.8"/>
    </g>

    <!-- ═══ FIGHTER JET ═══ -->
    <!--
      The jet is viewed from a low, slightly angled front-right perspective.
      Nose pointing left (leading edge) at ~(350, 430).
      Fuselage runs to the right to ~(1100, 470).
      The jet is in a slight banking/climbing pose.
    -->

    <g transform="translate(760, 445) rotate(-6)">

      <!-- === AFTERBURNER FLAME (behind the jet) === -->
      <g transform="translate(360, 0)">
        <ellipse cx="60"  cy="0"  rx="110" ry="18" fill="url(#flameGrad)" filter="url(#glowFilter)" opacity="0.9"/>
        <ellipse cx="50"  cy="0"  rx="80"  ry="12" fill="#fff5a0" opacity="0.6"/>
        <ellipse cx="30"  cy="0"  rx="55"  ry="8"  fill="#fffde0" opacity="0.5"/>
        <!-- Secondary flame nozzle -->
        <ellipse cx="60"  cy="28"  rx="80" ry="14" fill="url(#flameGrad)" opacity="0.7"/>
        <ellipse cx="50"  cy="28"  rx="58"  ry="9"  fill="#ffdd80" opacity="0.5"/>
      </g>

      <!-- === ENGINE NOZZLES === -->
      <ellipse cx="348" cy="-15" rx="22" ry="16" fill="#202830" stroke="#505a68" stroke-width="2"/>
      <ellipse cx="348" cy="15"  rx="22" ry="16" fill="#202830" stroke="#505a68" stroke-width="2"/>
      <ellipse cx="348" cy="-15" rx="16" ry="11" fill="url(#engineGlow)" opacity="0.9"/>
      <ellipse cx="348" cy="15"  rx="16" ry="11" fill="url(#engineGlow)" opacity="0.9"/>

      <!-- === MAIN WINGS (delta swept) === -->
      <!-- Left wing (lower in view / banking side) -->
      <polygon points="
        80,-12
        -200,160
        -260,155
        -230,120
        20,-10
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1.2" opacity="0.95"/>

      <!-- Right wing -->
      <polygon points="
        80,12
        -200,-160
        -260,-155
        -230,-120
        20,10
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1.2" opacity="0.95"/>

      <!-- Wing leading edge highlight -->
      <line x1="-200" y1="160"  x2="80" y2="-12" stroke="#d8e8f8" stroke-width="1.5" opacity="0.6"/>
      <line x1="-200" y1="-160" x2="80" y2="12"  stroke="#d8e8f8" stroke-width="1.5" opacity="0.6"/>

      <!-- === CANARDS (small forward wings) === -->
      <polygon points="
        -80,-10
        -160,-65
        -175,-60
        -155,-45
        -85,-8
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1"/>
      <polygon points="
        -80,10
        -160,65
        -175,60
        -155,45
        -85,8
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1"/>

      <!-- === VERTICAL STABILIZERS (twin tails) === -->
      <polygon points="
        200,-14
        200,-70
        280,-68
        310,-14
        280,-13
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1.2"/>
      <polygon points="
        200,14
        200,70
        280,68
        310,14
        280,13
      " fill="url(#wingGrad)" stroke="#58687a" stroke-width="1.2"/>

      <!-- === FUSELAGE === -->
      <!-- Main body -->
      <path d="
        M -380,0
        C -320,-8, -200,-18, -80,-20
        L 300,-22
        C 330,-22, 350,-18, 360,-14
        L 360,14
        C 350,18, 330,22, 300,22
        L -80,20
        C -200,18, -320,8, -380,0
        Z
      " fill="url(#fuselageGrad)" stroke="#485868" stroke-width="1.5"/>

      <!-- Fuselage spine (top centerline highlight) -->
      <path d="M -370,0 C -200,-5, 0,-8, 350,-8" stroke="#d0dce8" stroke-width="2" fill="none" opacity="0.5"/>

      <!-- Chine / leading edge strake -->
      <path d="
        M -380,0
        C -340,-4, -280,-8, -200,-14
        L -80,-20
        C -200,-18, -320,-8, -380,0
        Z
      " fill="#b0bcc8" opacity="0.4"/>
      <path d="
        M -380,0
        C -340,4, -280,8, -200,14
        L -80,20
        C -200,18, -320,8, -380,0
        Z
      " fill="#90a0b0" opacity="0.35"/>

      <!-- === COCKPIT CANOPY === -->
      <path d="
        M -280,-20
        C -260,-38, -200,-48, -140,-44
        L -60,-22
        C -100,-22, -220,-20, -280,-20
        Z
      " fill="#1a2a3a" stroke="#405060" stroke-width="1.2"/>
      <!-- Canopy glass highlight -->
      <path d="
        M -278,-20
        C -258,-36, -202,-44, -145,-41
        L -100,-28
        C -170,-26, -250,-22, -278,-20
        Z
      " fill="none" stroke="#7ab0d0" stroke-width="1" opacity="0.7"/>
      <!-- Canopy frame lines -->
      <line x1="-220" y1="-40" x2="-220" y2="-20" stroke="#506070" stroke-width="1.2" opacity="0.6"/>
      <line x1="-170" y1="-44" x2="-170" y2="-21" stroke="#506070" stroke-width="1.2" opacity="0.6"/>

      <!-- === INLET DUCTS === -->
      <!-- Left inlet -->
      <path d="
        M -180,20
        C -160,35, -120,40, -80,38
        L -20,30
        C -40,28, -140,25, -180,20
        Z
      " fill="#283848" stroke="#405060" stroke-width="1"/>
      <!-- Right inlet -->
      <path d="
        M -180,-20
        C -160,-35, -120,-40, -80,-38
        L -20,-30
        C -40,-28, -140,-25, -180,-20
        Z
      " fill="#283848" stroke="#405060" stroke-width="1"/>

      <!-- === NOSE CONE === -->
      <path d="
        M -380,0
        C -400,-4, -415,-2, -420,0
        C -415,2, -400,4, -380,0
        Z
      " fill="#788898" stroke="#506070" stroke-width="1"/>
      <!-- Nose tip -->
      <ellipse cx="-420" cy="0" rx="8" ry="3" fill="#606878"/>
      <!-- Radar nose highlight -->
      <line x1="-418" y1="-1" x2="-382" y2="-1" stroke="#a0b0c0" stroke-width="0.8" opacity="0.5"/>

      <!-- === SURFACE PANEL LINES === -->
      <g stroke="#405060" stroke-width="0.7" opacity="0.45" fill="none">
        <!-- Fuselage panel lines -->
        <line x1="-200" y1="-20" x2="-200" y2="20"/>
        <line x1="-100" y1="-21" x2="-100" y2="21"/>
        <line x1="0"    y1="-21" x2="0"    y2="21"/>
        <line x1="100"  y1="-21" x2="100"  y2="21"/>
        <line x1="200"  y1="-22" x2="200"  y2="22"/>
        <!-- Longitudinal line -->
        <path d="M -370,8 C -200,9, 0,10, 340,10"  />
        <path d="M -370,-8 C -200,-9, 0,-10, 340,-10"/>
        <!-- Wing panels -->
        <line x1="-80"  y1="-12" x2="-180" y2="-100"/>
        <line x1="-80"  y1="12"  x2="-180" y2="100"/>
        <line x1="0"    y1="-10" x2="-120" y2="-140"/>
        <line x1="0"    y1="10"  x2="-120" y2="140"/>
      </g>

      <!-- === WEAPONS PYLONS (subtle) === -->
      <rect x="-60" y="-13" width="30" height="6"  rx="2" fill="#384858" opacity="0.7"/>
      <rect x="-60" y="7"   width="30" height="6"  rx="2" fill="#384858" opacity="0.7"/>
      <!-- Missile shapes on wing -->
      <rect x="-120" y="-86"  width="55" height="8" rx="3" fill="#506070" opacity="0.65" transform="rotate(-52,-120,-86)"/>
      <rect x="-120" y="78"   width="55" height="8" rx="3" fill="#506070" opacity="0.65" transform="rotate(52,-120,78)"/>

      <!-- === HIGHLIGHT SHEEN (upper surface light catch) === -->
      <path d="
        M -340,-5
        C -200,-14, 0,-16, 300,-16
        L 300,-10
        C 0,-10, -200,-8, -340,0
        Z
      " fill="#e8f0f8" opacity="0.18"/>

    </g>
    <!-- End jet group -->

    <!-- ═══ CLOUD WISPS OVERLAPPING JET (depth effect) ═══ -->
    <g opacity="0.55">
      <ellipse cx="450" cy="500" rx="200" ry="40"  fill="url(#cloudGrad1)"/>
      <ellipse cx="350" cy="510" rx="150" ry="30"  fill="url(#cloudGrad2)"/>
      <ellipse cx="550" cy="495" rx="180" ry="35"  fill="url(#cloudGrad1)"/>
    </g>
    <g opacity="0.45">
      <ellipse cx="1100" cy="420" rx="170" ry="38"  fill="url(#cloudGrad2)"/>
      <ellipse cx="1200" cy="430" rx="140" ry="30"  fill="url(#cloudGrad1)"/>
    </g>

    <!-- ═══ SUN DISC ═══ -->
    <circle cx="1248" cy="162" r="42" fill="#fff8d0" opacity="0.92" filter="url(#glowFilter)"/>
    <circle cx="1248" cy="162" r="28" fill="#fffae0" opacity="0.97"/>

    <!-- ═══ ATMOSPHERIC HAZE (horizon) ═══ -->
    <rect x="0" y="680" width="1600" height="220" fill="#7fb3d3" opacity="0.18"/>

  </g>
  <!-- End scene clip -->

</svg>
